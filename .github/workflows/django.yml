name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install native build dependencies
      run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config unixodbc-dev
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Check dependency consistency
      run: python -m pip check
    - name: Run image compatibility smoke tests
      run: python scripts/test_pillow_compat.py
    - name: Run Tests
      run: |
        python manage.py test --settings=vitigo_pms.ci_settings
